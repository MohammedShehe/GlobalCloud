name: globalcloud
description: "Global Cloud - Secure Your Family World"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # For advanced animations and effects
  animations: ^2.0.11
  # For beautiful loading indicators
  flutter_spinkit: ^5.2.1
  # For custom fonts
  google_fonts: ^6.2.1
  # For particle effects
  simple_animations: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png